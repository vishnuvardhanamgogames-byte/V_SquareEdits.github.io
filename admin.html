<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ADMIN — Project Enquiries</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

  <!-- ===================== LOGIN PAGE ===================== -->
  <main class="login-page" id="loginPage" data-testid="admin-login-page">
    <form class="login-form" id="loginForm" novalidate>
      <p class="admin-eyebrow">ADMIN ACCESS</p>
      <h1 class="admin-heading">ENQUIRIES</h1>

      <div class="form-field mt-8">
        <label for="adminEmail" class="admin-label">EMAIL</label>
        <input
          type="email"
          id="adminEmail"
          data-testid="admin-email-input"
          class="admin-input"
          placeholder="admin@frameflow.studio"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-field">
        <label for="adminPassword" class="admin-label">PASSWORD</label>
        <input
          type="password"
          id="adminPassword"
          data-testid="admin-password-input"
          class="admin-input"
          placeholder="FrameFlow@2026"
          required
          autocomplete="current-password"
        />
      </div>

      <p class="login-error" id="loginError" data-testid="admin-login-error" aria-live="polite"></p>

      <button
        type="submit"
        class="btn-admin-primary"
        id="loginBtn"
        data-testid="admin-login-btn"
      >
        SIGN IN
      </button>

      <a href="index.html" class="admin-back-link" data-testid="admin-back-link">
        ← BACK TO PORTFOLIO
      </a>
    </form>
  </main>

  <!-- ===================== DASHBOARD ===================== -->
  <main class="dashboard" id="dashboard" data-testid="admin-dashboard" hidden>

    <header class="dash-header">
      <div>
        <p class="admin-eyebrow">ADMIN</p>
        <h1 class="admin-heading" id="dashTitle">PROJECT ENQUIRIES</h1>
      </div>
      <div class="dash-actions">
        <button class="btn-icon" id="refreshBtn" data-testid="admin-refresh-btn" aria-label="Refresh enquiries" title="Refresh">
          <!-- Refresh icon -->
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
        <button class="btn-icon-text" id="logoutBtn" data-testid="admin-logout-btn">
          <!-- Logout icon -->
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          LOGOUT
        </button>
      </div>
    </header>

    <div class="enquiry-list" id="enquiryList">
      <!-- Enquiry cards injected here by JS -->
    </div>

  </main>

  <!-- Toast container -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <!--
    BACKEND: to connect the FastAPI backend, add before admin.js:
    <script>window.FF_API_URL = "https://your-backend-url.com";</script>
    See BACKEND.md for full setup instructions.
  -->
  <script src="js/admin.js"></script>
</body>
</html>
